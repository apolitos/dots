env = WLR_NO_HARDWARE_CURSORS,1
env = XCURSOR_THEME,MeguminCursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,MeguminCursor
env = HYPRCURSOR_SIZE,24

# 1. Atualiza as variáveis do ambiente gráfico no DBus/Systemd primeiro
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# 2. Executa os scripts de portal e tema de cursor
exec-once = ~/.config/hypr/portal_fix.sh
exec-once = sleep 1 && hyprctl setcursor MeguminCursor 24

# Regras para ocultar a janela da bridge
windowrulev2 = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrulev2 = noanim, class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrulev2 = noblur, class:^(xwaylandvideobridge)$
windowrulev2 = nofocus, class:^(xwaylandvideobridge)$

exec-once = wpctl set-default alsa_input.usb-3142_Fifine_Microphone-00.mono-fallback && wpctl set-volume alsa_input.usb-3142_Fifine_Microphone-00.mono-fallback 1.5
